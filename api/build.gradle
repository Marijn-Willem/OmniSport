plugins {
    id 'sports.web'
	id 'war'
}

dependencies {
    implementation 'org.glassfish.jersey.containers:jersey-container-servlet:4.0.2'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:4.0.2'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.5'
    implementation 'org.ehcache:ehcache:3.12.0'
	implementation project(':teamcalc')
	implementation project(':cyclingroadcalc')
	implementation project(':dartscalc')
	implementation project(':speedskatingcalc')
}

war {
    archiveFileName = 'api.war'
}
